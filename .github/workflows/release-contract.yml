name: Release contract
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/lex-framework-v1.0.0/lex-framework-v1.0.0/target
  TEST_DATABASE_URL: postgres://lex_test:lex_local_test_only@127.0.0.1:55432/lex_disposable
  CONFIRM_DISPOSABLE_DATABASE: 'yes'
  LEX_TEST_COOKIE_SECRET: lex-disposable-ci-cookie-signing-secret-not-for-deployment
defaults:
  run:
    shell: bash
    working-directory: lex-framework-v1.0.0/lex-framework-v1.0.0
jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Validate workflow syntax and expressions
        working-directory: .
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -shellcheck="" .github/workflows/release-contract.yml
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lex-framework-v1.0.0/lex-framework-v1.0.0
      - name: Execute quality gates
        run: python3 integration/verify_release.py --output-dir "$RUNNER_TEMP/lex-evidence" --only format consumer-format check clippy doctests rustdoc features-default features-axum features-rustls
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: ${{ runner.temp }}/lex-evidence
          if-no-files-found: error
  database-and-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lex_test
          POSTGRES_PASSWORD: lex_local_test_only
          POSTGRES_DB: lex_disposable
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U lex_test -d lex_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lex-framework-v1.0.0/lex-framework-v1.0.0
      - name: Execute database-and-http gates
        run: python3 integration/verify_release.py --output-dir "$RUNNER_TEMP/lex-evidence" --only workspace-tests default-tests postgres-orm postgres-permissions postgres-mutations consumer
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-and-http-evidence
          path: ${{ runner.temp }}/lex-evidence
          if-no-files-found: error
  developer-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lex_test
          POSTGRES_PASSWORD: lex_local_test_only
          POSTGRES_DB: lex_disposable
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U lex_test -d lex_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lex-framework-v1.0.0/lex-framework-v1.0.0
      - name: Execute developer-acceptance gates
        run: python3 integration/verify_release.py --output-dir "$RUNNER_TEMP/lex-evidence" --only macro-consumers quickstart generated git-consumer
      - name: Verify the actual pushed Git revision
        if: github.event_name == 'push'
        env:
          CONSUMER_REPOSITORY: https://github.com/${{ github.repository }}
          CONSUMER_REVISION: ${{ github.sha }}
        run: |
          set -o pipefail
          python3 integration/verify_consumer.py --git "$CONSUMER_REPOSITORY" --rev "$CONSUMER_REVISION" 2>&1 | tee "$RUNNER_TEMP/lex-evidence/hosted-git-consumer.log"
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-acceptance-evidence
          path: ${{ runner.temp }}/lex-evidence
          if-no-files-found: error
  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lex-framework-v1.0.0/lex-framework-v1.0.0
      - name: Execute packaging gates
        run: python3 integration/verify_release.py --output-dir "$RUNNER_TEMP/lex-evidence" --only package packaged-consumer publish-dry-run
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-evidence
          path: ${{ runner.temp }}/lex-evidence
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: crate-packages
          path: lex-framework-v1.0.0/lex-framework-v1.0.0/target/package/*.crate
          if-no-files-found: error
  stable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lex-framework-v1.0.0/lex-framework-v1.0.0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo +stable check --workspace --all-targets --all-features --locked
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lex-framework-v1.0.0/lex-framework-v1.0.0
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lex-framework-v1.0.0/lex-framework-v1.0.0/docs-site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lex-framework-v1.0.0/lex-framework-v1.0.0/docs-site/package-lock.json
      - name: Verify canonical documentation copies
        run: |
          python3 ../integration/sync_docs.py
          git diff --exit-code -- src/content framework-source-docs
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-results
          path: lex-framework-v1.0.0/lex-framework-v1.0.0/docs-site/test-results
      - uses: actions/upload-pages-artifact@v5
        with:
          path: lex-framework-v1.0.0/lex-framework-v1.0.0/docs-site/dist
  release-contract:
    if: always()
    needs: [workflow-lint, quality, database-and-http, developer-acceptance, packaging, stable, dependency-audit, documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        working-directory: .
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          jobs = json.loads(os.environ['JOB_RESULTS'])
          failed = [name for name, job in jobs.items() if job['result'] != 'success']
          print('Failed or skipped jobs:', failed)
          sys.exit(bool(failed))
          PY
  deploy-documentation:
    needs: release-contract
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.LEX_DEPLOY_DOCS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
