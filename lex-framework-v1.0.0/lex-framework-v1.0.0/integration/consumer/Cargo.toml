[package]
name = "lex_developer_acceptance"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
lex-framework = { package = "lex-framework", path = "../../crate/lex_framework", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
async-trait = "0.1"
axum = "0.8"
http = "1"
tower = { version = "0.5", features = ["util"] }

[features]
default = []
postgres-integration = []

[dev-dependencies]
tempfile = "3"
