[package]
name = "lex-migration"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Lex framework migration components"
readme = "README.md"
keywords = ["lex", "web", "database"]
categories = ["web-programming", "database"]
documentation = "https://docs.rs/lex-migration"

[lib]
name = "migration"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
db_controller = { package = "lex-db-controller", version = "=1.0.0", path = "../db_controller" }
models = { package = "lex-models", version = "=1.0.0", path = "../models" }
sanitize-filename.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
