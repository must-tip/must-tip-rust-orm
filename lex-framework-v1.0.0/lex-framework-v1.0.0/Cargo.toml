[workspace]
resolver = "3"
members = [
    "crate/orm",
    "crate/db",
    "crate/db_controller",
    "crate/migration",
    "crate/secure_input",
    "crate/models",
    "crate/media",
    "crate/lex_rest",
    "crate/lex_cli",
    "crate/lex_framework",
    "project",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
config = "0.15.25"
dotenvy = "0.15"
htmlescape = "0.3"
hmac = "0.13.0"
percent-encoding = "2"
proc-macro2 = "1"
quote = "1"
regex = "1"
rust_decimal = { version = "1", features = ["serde"] }
sanitize-filename = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "sqlite",
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "derive",
    "uuid",
    "chrono",
    "json",
    "rust_decimal",
] }
syn = { version = "2", features = ["full", "visit-mut"] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
ammonia = "4"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
http = "1.4"
quick-xml = { version = "0.41.0", features = ["serialize"] }

db = { package = "lex-db", version = "=1.0.0", path = "crate/db" }
db_controller = { package = "lex-db-controller", version = "=1.0.0", path = "crate/db_controller" }
migration = { package = "lex-migration", version = "=1.0.0", path = "crate/migration" }
models = { package = "lex-models", version = "=1.0.0", path = "crate/models" }
lex_rest = { package = "lex-rest", version = "=1.0.0", path = "crate/lex_rest" }
orm = { package = "lex-orm", version = "=1.0.0", path = "crate/orm" }
secure_input = { package = "lex-secure-input", version = "=1.0.0", path = "crate/secure_input" }
media = { package = "lex-media", version = "=1.0.0", path = "crate/media" }
lex_framework = { package = "lex-framework", version = "=1.0.0", path = "crate/lex_framework" }

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.dev.package.sqlx-macros]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
