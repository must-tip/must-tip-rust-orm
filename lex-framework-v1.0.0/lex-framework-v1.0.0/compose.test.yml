services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lex_disposable
      POSTGRES_USER: lex_test
      POSTGRES_PASSWORD: lex_local_test_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lex_test -d lex_disposable"]
      interval: 2s
      timeout: 3s
      retries: 30
