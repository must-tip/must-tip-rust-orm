name: Release contract
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lex_test
          POSTGRES_PASSWORD: lex_local_test_only
          POSTGRES_DB: lex_disposable
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U lex_test -d lex_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://lex_test:lex_local_test_only@127.0.0.1:55432/lex_disposable
      CONFIRM_DISPOSABLE_DATABASE: 'yes'
      LEX_TEST_COOKIE_SECRET: lex-disposable-ci-cookie-signing-secret-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - name: Legacy opt-in PostgreSQL workflows
        run: |
          cargo test -p lex-db-controller --test postgres_orm -- --ignored --test-threads=1
          cargo test -p lex-rest --test postgres_permissions -- --ignored --test-threads=1
          cargo test -p lex-rest --test postgres_mutation -- --ignored --test-threads=1
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo check -p lex-framework --no-default-features --locked
      - run: cargo check -p lex-framework --features axum --locked
      - run: cargo check -p lex-framework --features axum-rustls --locked
      - name: Independent facade consumer on both databases
        run: python3 integration/verify_consumer.py --postgres
      - name: Direct and renamed macro consumers
        run: python3 integration/verify_macro_consumers.py
      - name: Copyable quickstart with live HTTP
        run: python3 integration/verify_examples.py
      - name: Generated application acceptance
        run: python3 integration/verify_generated.py --postgres
      - name: Git branch, commit and tag consumer
        run: python3 integration/verify_consumer.py --local-git
      - name: Package every supported crate together
        run: cargo package --workspace --exclude lex_framework_server --all-features --locked
      - name: Publication verification without upload
        run: cargo publish --workspace --exclude lex_framework_server --all-features --locked --dry-run
      - name: Consumer of normalized packaged sources
        run: python3 integration/verify_packages.py
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-artifacts
          path: target/package/*.crate
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable check --workspace --all-targets --all-features --locked
  documentation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Verify canonical documentation copies
        run: |
          python3 ../integration/sync_docs.py
          git diff --exit-code -- src/content framework-source-docs
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
